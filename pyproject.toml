[project]
name = "bakeoff"
version = "0.1.0"
description = "When several pull requests compete for one issue, run the bake-off in a Switch room."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.2",
  "pyyaml>=6",
]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
screens = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
